interactions:
- request:
    body: ''
    headers:
      accept:
      - '*/*'
      accept-encoding:
      - gzip, deflate
      connection:
      - keep-alive
      content-length:
      - '0'
      user-agent:
      - python-httpx2/2.16.0
    method: POST
    uri: https://zosmf.example/zosmf/services/authenticate
  response:
    body:
      string: '{"returnCode":8,"reasonCode":1,"message":"Login failed. Check if the
        user ID and password you use for the Basic Auth is correct, and if the user
        ID has the required SAF permissions."}'
    headers:
      content-language:
      - en
      content-type:
      - application/json;charset=ISO-8859-1
      date:
      - Mon, 02 Nov 2026 17:47:18 GMT
      strict-transport-security:
      - max-age=31536000; includeSubDomains
      transfer-encoding:
      - chunked
      x-content-type-options:
      - nosniff
      x-powered-by:
      - Servlet/3.1
      x-xss-protection:
      - 1; mode=block
    status:
      code: 500
      message: Internal Server Error
version: 1
