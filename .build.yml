arch: null
artifacts: null
environment: null
image: alpine/old
packages:
- poetry
repositories: null
secrets:
- 60c74018-5d43-4a31-9bec-55c59e80f0b9 # github ssh key
- c0e6f7da-5a15-4991-acad-5bcae9debca1 # pypi zosmfrestapi token
shell: null
sources:
- https://git.sr.ht/~ocurero/zosmfrestapi
tasks:
- run_tests: |
    cd zosmfrestapi
    poetry install
    poetry run pytest
- sync_to_github: |
    ssh-keyscan github.com >> ~/.ssh/known_hosts
    cd zosmfrestapi
    git push --mirror git+ssh://git@github.com/ocurero/zosmfrestapi.git
- publish_pypi: |
    # Only in tags
    if [[ "$GIT_REF" =~ ^refs/tags/ ]]; then
      poetry config pypi-token.pypi "$(cat ~/PYPI_TOKEN_ZOSMFRESTAPI)"
      cd zosmfrestapi
      poetry build --format sdist
      poetry publish 
    fi
triggers: null
