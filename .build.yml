arch: null
artifacts: null
environment: null
image: alpine/old
packages:
- git
- poetry
- py3-pip
- nodejs
repositories: null
secrets:
- 60c74018-5d43-4a31-9bec-55c59e80f0b9 # github ssh key
- c0e6f7da-5a15-4991-acad-5bcae9debca1 # pypi zosmfrestapi token
shell: null
sources:
- https://git.sr.ht/~ocurero/zosmfrestapi
tasks:
- run_tests: |
    cd zosmfrestapi
    poetry install --all-groups
    poetry run poe check
- sync_to_github: |
    # Only in branches, to avoid race conditions when tags and branch commits are pushed together
    if [[ "$GIT_REF" =~ ^refs/heads/ ]]; then
      ssh-keyscan github.com >> ~/.ssh/known_hosts
      cd zosmfrestapi
      git push --mirror git+ssh://git@github.com/ocurero/zosmfrestapi.git
    fi
- publish_pypi: |
    # Only in tags
    if [[ "$GIT_REF" =~ ^refs/tags/ ]]; then
      pip install --break-system-packages "poetry-dynamic-versioning[plugin]"
      poetry config pypi-token.pypi "$(cat ~/PYPI_TOKEN_ZOSMFRESTAPI)"
      cd zosmfrestapi
      poetry publish --build
    fi
triggers: null
