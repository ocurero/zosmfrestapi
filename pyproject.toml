[project]
name = "zosmfrestapi"
description = "A Python wrapper for the z/OSMF REST API"
readme = "README.md"
authors = [
    {name = "Oscar Curero",email = "dev@curero.es"}
]
license = "MIT"
requires-python = ">=3.12"
keywords = ["z/OSMF", "IBM Z", "mainframe", "REST API"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx2 (>=2.12.0,<3.0.0)",
    "pendulum (>=3.2.0,<4.0.0)",
    "dacite (>=1.9.2,<2.0.0)",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://sr.ht/~ocurero/zosmfrestapi/"
Repository = "https://git.sr.ht/~ocurero/zosmfrestapi"
Issues = "https://todo.sr.ht/~ocurero/zosmfrestapi"
PyPI = "https://pypi.org/project/zosmfrestapi/"

[project.optional-dependencies]
zcrypto = [
    "py_zcrypto",
]

[dependency-groups]
dev = [
    "coverage (>=7.17.3,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "pytest-recording (>=0.14.0,<0.15.0)",
    "pytest-httpx2 (>=1.0.0,<2.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "poethepoet (>=0.49.0,<0.50.0)",
    "pyright (>=1.1.414,<2.0.0)",
]
zcrypto-dev = [
    "cryptography (>=50.0.2,<51.0.0)"
]

[tool.black]
line-length = 96

[tool.flake8]
max-line-length = 96
extend-ignore = ["E203", "W503"]
per-file-ignores = "tests/*.py:E501"

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.poe.groups.quality.tasks.format]
help = "Format code acording to black."
cmd = "black zosmfrestapi tests"

[tool.poe.groups.quality.tasks.quality]
help = "Run quality checks: black, flake8, mypy and pyright."
sequence = [
    { cmd = "black --check ." },
    { cmd = "flake8 zosmfrestapi" },
    { cmd = "mypy zosmfrestapi" },
    { cmd = "pyright --warnings" }
]

[tool.poe.groups.testing.tasks.client_tests]
help = "Run client tests only."
sequence = [{cmd = """coverage run --omit='tests/*,*/zcrypto*' -m 
                   pytest --ignore=tests/test_zcrypto_client.py"""},
            {cmd = "coverage report --fail-under=100 --show-missing"}
]

[tool.poe.groups.testing.tasks.zcrypto_tests]
help = "Run zcrypto tests only."
sequence = [{cmd = """coverage run --omit='tests/*' --include='*/zcrypto*' -m
                   pytest tests/test_zcrypto_client.py"""},
            {cmd = "coverage report --fail-under=100 --show-missing"}
            ]

[tool.poe.groups.testing.tasks.tests]
help = "Run client and zcrypto tests."
sequence = ["client_tests", "zcrypto_tests"]

[tool.poe.tasks.check]
help = "Run all checks."
sequence = ["quality", "client_tests", "zcrypto_tests"]

[[tool.mypy.overrides]]
module = ["OpenSSL.*", "py_zcrypto.*"]
ignore_missing_imports = true

[tool.poetry]
version = "0.0.0"

[tool.poetry-dynamic-versioning]
enable = true

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
